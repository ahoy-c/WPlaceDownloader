name: Update Example Image

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-example:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: assets
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Allow build scripts in pnpm-workspace.yaml
              run: |
                  printf "allowBuilds:\n  sharp: true\n  esbuild: true\n  es5-ext: true\n" >> pnpm-workspace.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare env
              run: |
                  if [ -f .env.example ] && [ ! -f .env ]; then
                    cp .env.example .env
                  else
                    touch .env
                  fi

            - name: Build project
              run: pnpm build

            - name: Run project to generate output
              run: pnpm start

            - name: Update example image
              run: cp output.png example.png

            - name: Commit and push changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add example.png
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "Updated the example image"
                    git push
                  fi
